<!DOCTYPE html>
<html lang="tr">
<head>

  <link rel="manifest" href="manifest.json" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F3EFE6;
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #2A2620;

      padding: 24px;

    img { width: 64px; height: 64px; margin-bottom: 16px; }

<body>

      "Tarif Kutusu'na Gönder"i seçmene yarayan küçük bir yönlendirici.
      Bu sayfayı ana ekranına ekledikten sonra artık paylaşım menüsünde görünecek.

  </div>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
