<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarif Kutusu'na Gönderiliyor…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F3EFE6;
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #2A2620;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 360px;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #5C564A; margin: 0; }
    a { color: #2F4A3D; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="status">Tarif Kutusu'na yönlendiriliyor…</h1>
    <p id="detail">Bir saniye…</p>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }

    const APP_URL = "https://tarif-kutusu-paylas.vercel.app/";

    const params = new URLSearchParams(window.location.search);
    const combined = [params.get("url"), params.get("text"), params.get("title")]
      .filter(Boolean)
      .join(" ");
    const found = combined.match(/https?:\/\/[^\s]+/g) || [];
    const link =
      found.find((u) => /tiktok\.com|youtu\.be|youtube\.com/i.test(u)) || found[0] || "";

    function gotoApp(url) {
      const isAndroid = /Android/i.test(navigator.userAgent);
      if (isAndroid) {
        const noScheme = url.replace(/^https?:\/\//, "");
        window.location.href =
          "intent://" + noScheme + "#Intent;scheme=https;package=com.android.chrome;end";
      } else {
        window.location.replace(url);
      }
    }

    async function goNow() {
      if (link) {
        // Uygulama artık kendimizin olduğu için linki panoya kopyalamaya gerek yok:
        // doğrudan ?link= parametresiyle gönderip "Yeni Tarif Çıkar" ekranını
        // link dolu şekilde açtırıyoruz.
        document.getElementById("status").textContent = "Tarif Kutusu'na yönlendiriliyor…";
        const target = APP_URL + "?link=" + encodeURIComponent(link);
        setTimeout(function () {
          gotoApp(target);
        }, 400);
      } else {
        document.getElementById("status").textContent = "Link bulunamadı";
        document.getElementById("detail").innerHTML =
          'Otomatik yakalayamadım. <a href="' + APP_URL + '">Tarif Kutusu\'nu aç</a> ve linki elle yapıştır.';
      }
    }

    goNow();
  </script>
</body>
</html>
