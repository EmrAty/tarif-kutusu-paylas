<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarif Kutusu'na Gönderiliyor…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F3EFE6;
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #2A2620;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 360px;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #5C564A; margin: 0; }
    a { color: #2F4A3D; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="status">Tarif Kutusu'na yönlendiriliyor…</h1>
    <p id="detail">Bir saniye…</p>
  </div>

  <script>
    const ARTIFACT_URL = "https://claude.ai/public/artifacts/61b482b5-785d-4018-8884-46cb5e19cae9";

    const params = new URLSearchParams(window.location.search);
    const combined = [params.get("url"), params.get("text"), params.get("title")]
      .filter(Boolean)
      .join(" ");
    const found = combined.match(/https?:\/\/[^\s]+/g) || [];
    const link =
      found.find((u) => /tiktok\.com|youtu\.be|youtube\.com/i.test(u)) || found[0] || "";

    async function goNow() {
      if (link) {
        try {
          await navigator.clipboard.writeText(link);
          document.getElementById("status").textContent = "Link kopyalandı";
          document.getElementById("detail").textContent =
            "Tarif Kutusu'na yönlendiriliyor, link kutusuna yapıştırman yeterli.";
        } catch (e) {
          document.getElementById("status").textContent = "Tarif Kutusu'na yönlendiriliyor";
        }
        setTimeout(function () {
          window.location.replace(ARTIFACT_URL);
        }, 900);
      } else {
        document.getElementById("status").textContent = "Link bulunamadı";
        document.getElementById("detail").innerHTML =
          'Otomatik yakalayamadım. <a href="' + ARTIFACT_URL + '">Tarif Kutusu\'nu aç</a> ve linki elle yapıştır.';
      }
    }

    goNow();
  </script>
</body>
</html>
